version: 1
name: ecommerce
label: E-commerce Analytics
description: Grain-aware semantic model for the example store

data_sources:
  orders:
    type: parquet
    path: data/orders.parquet
    grain: [id]
  order_items:
    type: parquet
    path: data/order_items.parquet
    grain: [order_id, product_id]
  customers:
    type: parquet
    path: data/customers.parquet
    grain: [id]
  products:
    type: parquet
    path: data/products.parquet
    grain: [id]

dimensions:
  customer_id:
    source: customers
    column: id
    data_type: string
    description: Customer identifier
  customer_segment:
    source: customers
    column: segment
    data_type: string
    description: Customer segment
  customer_country:
    source: customers
    column: country
    data_type: string
    description: Customer country
  product_id:
    source: products
    column: id
    data_type: string
    description: Product identifier
  product_category:
    source: products
    column: category
    data_type: string
    description: Product category
  product_subcategory:
    source: products
    column: subcategory
    data_type: string
    description: Product subcategory
  order_date:
    source: orders
    column: created_at
    data_type: timestamp
    description: Order creation timestamp
  order_status:
    source: orders
    column: status
    data_type: string
    description: Order status
  payment_method:
    source: orders
    column: payment_method
    data_type: string
    description: Payment method

facts:
  order_amount:
    source: orders
    data_type: decimal
    expression: orders.amount
    description: Revenue recorded at order grain
  order_total_amount:
    source: orders
    data_type: decimal
    expression: orders.total_amount
    description: Order total including shipping and discounts
  discount_amount:
    source: orders
    data_type: decimal
    expression: orders.discount_amount
    description: Discount recorded at order grain
  shipping_cost:
    source: orders
    data_type: decimal
    expression: orders.shipping_cost
    description: Shipping cost recorded at order grain
  order_id:
    source: orders
    data_type: string
    expression: orders.id
    description: Stable order identifier
  completed_order_id:
    source: orders
    data_type: string
    expression: if(orders.status = 'completed', orders.id, null)
    description: Identifier for completed orders
  item_quantity:
    source: order_items
    data_type: integer
    expression: order_items.quantity
    description: Quantity on one order item
  item_revenue:
    source: order_items
    data_type: decimal
    expression: order_items.total
    description: Revenue recorded on one order item
  item_cost:
    source: order_items
    data_type: decimal
    expression: order_items.quantity * products.cost
    description: Extended product cost for one order item

measures:
  total_revenue:
    fact: order_amount
    aggregation: sum
    description: Sum of order revenue
  total_order_total:
    fact: order_total_amount
    aggregation: sum
    description: Sum of order totals
  total_discount:
    fact: discount_amount
    aggregation: sum
    description: Sum of order discounts
  total_shipping:
    fact: shipping_cost
    aggregation: sum
    description: Sum of order shipping costs
  order_count:
    fact: order_id
    aggregation: count_distinct
    description: Number of orders
  completed_order_count:
    fact: completed_order_id
    aggregation: count_distinct
    description: Number of completed orders
  units_sold:
    fact: item_quantity
    aggregation: sum
    description: Sum of item quantities
  total_item_revenue:
    fact: item_revenue
    aggregation: sum
    description: Sum of item revenue
  total_item_cost:
    fact: item_cost
    aggregation: sum
    description: Sum of extended item cost

metrics:
  total_revenue:
    expression: total_revenue
    measures: [total_revenue]
    description: Order revenue metric
  order_count:
    expression: order_count
    measures: [order_count]
    description: Order count metric
  total_discount:
    expression: total_discount
    measures: [total_discount]
    description: Order discount metric
  total_shipping:
    expression: total_shipping
    measures: [total_shipping]
    description: Order shipping metric
  completed_order_count:
    expression: completed_order_count
    measures: [completed_order_count]
    description: Completed order count metric
  total_item_revenue:
    expression: total_item_revenue
    measures: [total_item_revenue]
    description: Item revenue metric
  total_item_cost:
    expression: total_item_cost
    measures: [total_item_cost]
    description: Item cost metric
  units_sold:
    expression: units_sold
    measures: [units_sold]
    description: Units sold metric
  average_order_value:
    expression: total_revenue / nullif(order_count, 0)
    measures: [total_revenue, order_count]
    description: Average order revenue
  discount_rate:
    expression: total_discount / nullif(total_revenue, 0)
    measures: [total_discount, total_revenue]
    description: Discount as a share of order revenue
  order_completion_rate:
    expression: completed_order_count / nullif(order_count, 0)
    measures: [completed_order_count, order_count]
    description: Completed orders as a share of all orders
  average_item_price:
    expression: total_item_revenue / nullif(units_sold, 0)
    measures: [total_item_revenue, units_sold]
    description: Average revenue per item unit
  gross_margin:
    expression: >-
      (total_item_revenue - total_item_cost) / nullif(total_item_revenue, 0)
    measures: [total_item_revenue, total_item_cost]
    description: Item gross margin ratio

relationships:
  customer_orders:
    source: customers
    target: orders
    type: one_to_many
    source_column: id
    target_column: customer_id
  order_items_orders:
    source: orders
    target: order_items
    type: one_to_many
    source_column: id
    target_column: order_id
  product_order_items:
    source: products
    target: order_items
    type: one_to_many
    source_column: id
    target_column: product_id
