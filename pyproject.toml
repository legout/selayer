[project]
name = "selayer"
version = "0.1.0"
description = "A small semantic layer for analytical queries."
readme = "README.md"
authors = [{ name = "legout", email = "ligno.blades@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
  "duckdb>=1.3.2",
  "polars>=1.31.0",
  "pyarrow>=20.0.0",
  "pyyaml>=6.0.2",
]

[project.scripts]
selayer-okf = "selayer.okf.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "faker>=37.4.0",
  "ipython>=9.4.0",
  "pandas>=2.3.1",
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "ruff>=0.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/selayer"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
extraPaths = ["src", ".venv/lib/python3.13/site-packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["legacy"]
line-length = 88

target-version = "py313"
