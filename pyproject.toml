[project]
name = "selayer"
version = "0.1.0"
description = "A small semantic layer for analytical queries."
readme = "README.md"
authors = [{ name = "legout", email = "ligno.blades@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
  "duckdb>=1.3.2",
  "polars>=1.31.0",
  "pyarrow>=20.0.0",
  "pyyaml>=6.0.2",
]

[project.scripts]
selayer-okf = "selayer.okf.cli:run"
selayer = "selayer.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = ["packages/selayer-discovery"]

[project.optional-dependencies]
s3 = ["boto3>=1.40,<2"]
delta = ["deltalake>=1.6.2,<2"]
iceberg = ["pyiceberg[pyarrow,sql-sqlite]>=0.11.1,<0.12"]
postgres = ["psycopg[binary]>=3.3.4,<4"]
all = [
  "boto3>=1.40,<2",
  "deltalake>=1.6.2,<2",
  "psycopg[binary]>=3.3.4,<4",
  "pyiceberg[pyarrow,sql-sqlite]>=0.11.1,<0.12",
]

[dependency-groups]
dev = [
  "deltalake>=1.6.2",
  "faker>=37.4.0",
  "ipython>=9.4.0",
  "pandas>=2.3.1",
  "pyright>=1.1.411",
  "pytest>=9.1.1",
  "ruff>=0.16.0",
  "s3fs>=2026.6.0",
  "testcontainers[minio,postgres]>=4.15,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/selayer"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
extraPaths = [
  "src",
  "tests/sources",
  "packages/selayer-discovery/src",
  "packages/selayer-discovery/tests",
  ".venv/lib/python3.13/site-packages",
]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/selayer-discovery/tests"]
addopts = "--import-mode=importlib"
pythonpath = [".", "packages/selayer-discovery/src"]
markers = [
  "integration: tests requiring an external service such as Docker or MinIO",
]

[tool.ruff]
extend-exclude = ["legacy"]
line-length = 88

target-version = "py313"
