[project]
name = "selayer-discovery"
version = "0.1.0"
description = "Deterministic agent-assisted semantic discovery for selayer."
requires-python = ">=3.13"
dependencies = [
  "filelock>=3.20,<4",
  "ruamel-yaml>=0.18,<0.19",
  "selayer>=0.1.0",
]

[project.scripts]
selayer-discovery = "selayer_discovery.cli:run"

# Read-only knowledge-provider *types*. Only providers declared in this
# group may be configured; executable paths and subprocesses are not supported.
[project.entry-points."selayer_discovery.knowledge_providers"]
okf-filesystem = "selayer_discovery.knowledge:FilesystemOkfProvider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/selayer_discovery"]

# Ship the single canonical Agent Skill body inside the wheel. The
# repository-level ``.agents/skills/semantic-discovery`` skill only forwards
# here, so the wheel is the one source of truth for the skill text.
[tool.hatch.build.targets.wheel.force-include]
"skills/semantic-discovery" = "skills/semantic-discovery"

[tool.uv.sources]
selayer = { workspace = true }
